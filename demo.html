<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./index.html">
  <title>Recruiter Workbench Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3f6fb;
      color: #172033;
    }
    .panel {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid #dce3ee;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 46px rgba(19, 33, 56, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 20px;
      color: #647084;
      line-height: 1.7;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 7px;
      background: #1262ff;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
  <script>
    window.location.replace('./index.html');
  </script>
</head>
<body>
  <main class="panel">
    <h1>正在打开 Recruiter Workbench</h1>
    <p>如果页面没有自动跳转，请点击下面的按钮进入可操作的在线工作台。</p>
    <a href="./index.html">进入工作台</a>
  </main>
</body>
</html>
